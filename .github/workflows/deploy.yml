name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy public/ to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account IDs aren't secret; only the API token is.
          accountId: 5c1c7c37766a99ec025f20ba41c4f6da
          command: pages deploy --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
